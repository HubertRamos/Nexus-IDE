schema_version = 1
name = "Nexus High Contrast"
author = "Nexus"
version = "1.0.0"
description = "Máximo contraste e cores saturadas para baixa visão e terminais com pouca fidelidade de cor."

[ui]
background = "#000000"
surface = "#0a0a0a"
panel = "#111111"
border = "#ffffff"
foreground = "#ffffff"
muted = "#c0c0c0"
accent = "#00ffff"
cursor = "#ffff00"
cursor_text = "#000000"
selection = "#0000ff"
selection_text = "#ffffff"
current_line = "#1a1a00"
status_bar = "#000000"
status_bar_text = "#ffffff"
success = "#00ff00"
error = "#ff3030"
warning = "#ffff00"
dialog = "#111111"

[syntax]
keyword = "#ff00ff"
string = "#00ff00"
comment = "#b0b0b0"
number = "#ff8000"
function = "#00ffff"
method = "#00ffff"
type = "#ffff00"
variable = "#ffffff"
constant = "#ff8000"
operator = "#00ffff"
attribute = "#ff00ff"
